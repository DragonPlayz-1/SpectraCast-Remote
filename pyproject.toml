[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectracast-remote"
version = "0.1.0"
description = "A beautiful local-first web remote for Android TV devices"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "SpectraCast contributors"},
]
dependencies = [
  "aiohttp>=3.9,<4",
  "cryptography>=41",
  "protobuf>=4.21",
  "zeroconf>=0.132",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "aiohttp>=3.9,<4",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.8",
  "mypy>=1.10",
]

[project.scripts]
spectracast = "spectracast.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spectracast = ["web/dist/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".git", ".venv", "build", "dist", "src/spectracast/wire/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S104"]

[tool.mypy]
python_version = "3.10"
files = ["src/spectracast"]
ignore_missing_imports = true
check_untyped_defs = true
