<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">SpectraCast app launcher</title><desc id="desc">Search drawer and streaming app cards in the SpectraCast interface.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08090f"/><stop offset="1" stop-color="#151a31"/></linearGradient><linearGradient id="drawer" x2="0" y2="1"><stop stop-color="#1a1c2b"/><stop offset="1" stop-color="#0f111b"/></linearGradient></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><rect x="0" y="0" width="205" height="760" fill="#0b0c13" opacity=".9"/><text x="42" y="60" fill="#f6f7fb" font-size="20" font-weight="700">◈ Spectra<tspan fill="#858b9f" font-weight="400">Cast</tspan></text><text x="42" y="130" fill="#a9a1ff" font-size="13">◉  Command center</text><text x="42" y="174" fill="#858b9f" font-size="13">▣  Remote</text><text x="42" y="218" fill="#f6f7fb" font-size="13">▦  Apps</text><text x="42" y="262" fill="#858b9f" font-size="13">⌁  Activity</text><text x="248" y="52" fill="#777e90" font-size="12">Workspace  ›  <tspan fill="#d8dae5">Apps</tspan></text><text x="248" y="126" fill="#8b91a4" font-size="10" letter-spacing="2">QUICK LAUNCH</text><text x="248" y="166" fill="#f6f7fb" font-size="32" font-weight="700">Your apps</text><text x="248" y="198" fill="#a0a3b5" font-size="13">Everything you watch, one tap away.</text><rect x="248" y="242" width="260" height="148" rx="18" fill="#201a2c" stroke="#ffffff" stroke-opacity=".1"/><circle cx="300" cy="296" r="26" fill="#d61f2c"/><text x="291" y="305" fill="white" font-size="25" font-weight="700">N</text><text x="280" y="354" fill="#f6f7fb" font-size="16" font-weight="700">Netflix</text><text x="280" y="374" fill="#858b9f" font-size="11">Continue watching</text><rect x="530" y="242" width="260" height="148" rx="18" fill="#191d39" stroke="#9588ff" stroke-opacity=".48"/><circle cx="582" cy="296" r="26" fill="#ff0033"/><text x="572" y="303" fill="white" font-size="21">▶</text><text x="562" y="354" fill="#f6f7fb" font-size="16" font-weight="700">YouTube</text><text x="562" y="374" fill="#78e4af" font-size="11">Playing now</text><rect x="812" y="242" width="260" height="148" rx="18" fill="#132332" stroke="#ffffff" stroke-opacity=".1"/><circle cx="864" cy="296" r="26" fill="#0876d1"/><text x="849" y="303" fill="white" font-size="18" font-weight="700">D+</text><text x="844" y="354" fill="#f6f7fb" font-size="16" font-weight="700">Disney+</text><text x="844" y="374" fill="#858b9f" font-size="11">Recently opened</text><rect x="248" y="430" width="824" height="240" rx="20" fill="#11131d" stroke="#ffffff" stroke-opacity=".1"/><text x="278" y="468" fill="#b1a9ff" font-size="10" letter-spacing="2">SEARCH YOUR TV</text><text x="278" y="504" fill="#f6f7fb" font-size="23" font-weight="700">Find your next thing</text><rect x="278" y="528" width="515" height="46" rx="10" fill="#0b0d15" stroke="#ffffff" stroke-opacity=".12"/><text x="300" y="557" fill="#858b9f" font-size="13">⌕  Try “The Bear” or “music”</text><rect x="815" y="528" width="102" height="46" rx="10" fill="#8175e9"/><text x="841" y="557" fill="white" font-size="12" font-weight="700">Search</text><text x="278" y="620" fill="#8b91a4" font-size="10" letter-spacing="2">SUGGESTED FOR YOU</text><text x="278" y="648" fill="#f6f7fb" font-size="13">◉  Midnight City Radio</text><text x="598" y="648" fill="#f6f7fb" font-size="13">✦  The Bear</text></g>
</svg>
