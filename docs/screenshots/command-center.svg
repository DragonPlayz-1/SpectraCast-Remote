    <g fill="#858b9f" font-size="13"><text x="45" y="215">▣  Remote</text><text x="45" y="258">▦  Apps</text><text x="45" y="301">⌁  Activity</text></g>
    <rect x="26" y="610" width="138" height="78" rx="14" fill="#191536" stroke="#5b50b4" stroke-opacity=".45"/><text x="42" y="635" fill="#9d94ff" font-size="10">●  DEMO ENVIRONMENT</text><text x="42" y="658" fill="#f0efff" font-size="13">Living Room TV</text><text x="42" y="677" fill="#858b9f" font-size="10">Demo connected</text>
