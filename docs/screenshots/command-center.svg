    <rect x="786" y="565" width="368" height="141" rx="18" fill="#11131d" stroke="#ffffff" stroke-opacity=".09"/><text x="811" y="598" fill="#8b91a4" font-size="10" letter-spacing="2">QUICK LAUNCH</text><text x="811" y="628" fill="#f6f7fb" font-size="17" font-weight="700">Your apps</text><circle cx="820" cy="660" r="16" fill="#d61f2c"/><text x="816" y="666" fill="white" font-size="16" font-weight="700">N</text><text x="850" y="657" fill="#f6f7fb" font-size="12">Netflix</text><text x="850" y="674" fill="#858b9f" font-size="10">Continue watching</text><circle cx="1030" cy="660" r="16" fill="#ff0033"/><text x="1024" y="666" fill="white" font-size="13">▶</text><text x="1055" y="657" fill="#f6f7fb" font-size="12">YouTube</text><text x="1055" y="674" fill="#858b9f" font-size="10">Playing now</text>
