<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">SpectraCast command center</title><desc id="desc">Dark premium dashboard with a glowing remote orb and TV controls.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08090f"/><stop offset="1" stop-color="#171533"/></linearGradient>
    <linearGradient id="hero" x2="1"><stop stop-color="#30285e"/><stop offset="1" stop-color="#141a2b"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#d7d3ff"/><stop offset=".32" stop-color="#8278ed"/><stop offset="1" stop-color="#16162e"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="190" height="760" fill="#0b0c13" opacity=".88"/>
  <circle cx="1010" cy="100" r="175" fill="#6f62dc" opacity=".16" filter="url(#glow)"/>
  <g font-family="Inter,Arial,sans-serif">
