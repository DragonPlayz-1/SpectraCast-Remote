<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">SpectraCast mobile remote</title><desc id="desc">A phone-sized responsive remote with a glowing D-pad and playback controls.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08090f"/><stop offset="1" stop-color="#211b42"/></linearGradient><linearGradient id="phone" x2="0" y2="1"><stop stop-color="#1a1c2a"/><stop offset="1" stop-color="#0f111b"/></linearGradient></defs><rect width="900" height="760" rx="28" fill="url(#bg)"/><circle cx="150" cy="120" r="220" fill="#6f62dc" opacity=".18"/><g font-family="Inter,Arial,sans-serif"><text x="60" y="92" fill="#f6f7fb" font-size="24" font-weight="700">Remote control, <tspan fill="#8f87f5">reimagined.</tspan></text><text x="60" y="128" fill="#a0a3b5" font-size="14">Same beautiful command center on every screen.</text><rect x="405" y="48" width="330" height="664" rx="40" fill="#05060b" stroke="#858b9f" stroke-opacity=".42" stroke-width="5"/><rect x="423" y="74" width="294" height="606" rx="27" fill="url(#phone)"/><rect x="530" y="86" width="80" height="6" rx="3" fill="#3b3e4b"/><text x="450" y="137" fill="#9d94ff" font-size="10" letter-spacing="2">LIVING ROOM · LIVE</text><circle cx="685" cy="134" r="4" fill="#78e4af"/><text x="450" y="170" fill="#f6f7fb" font-size="22" font-weight="700">Living Room TV</text><text x="450" y="194" fill="#858b9f" font-size="11">YouTube · Midnight City Radio</text><rect x="450" y="220" width="240" height="42" rx="12" fill="#161a2a"/><text x="467" y="246" fill="#c8c1ff" font-size="12">⌕  Search your TV</text><circle cx="570" cy="393" r="91" fill="#161a27" stroke="#3a3e53"/><circle cx="570" cy="393" r="44" fill="#7166dc" fill-opacity=".28" stroke="#9588ff"/><text x="563" y="402" fill="#edeaff" font-size="19">✓</text><text x="563" y="319" fill="#abb1c1" font-size="20">↑</text><text x="497" y="401" fill="#abb1c1" font-size="20">←</text><text x="633" y="401" fill="#abb1c1" font-size="20">→</text><text x="563" y="475" fill="#abb1c1" font-size="20">↓</text><circle cx="493" cy="535" r="22" fill="#1b1e2d"/><circle cx="570" cy="535" r="22" fill="#1b1e2d"/><circle cx="647" cy="535" r="22" fill="#1b1e2d"/><text x="486" y="542" fill="#abb1c1" font-size="16">⌂</text><text x="563" y="542" fill="#abb1c1" font-size="16">↩</text><text x="640" y="542" fill="#abb1c1" font-size="16">⏻</text><rect x="450" y="587" width="240" height="9" rx="4" fill="#292d3d"/><rect x="450" y="587" width="82" height="9" rx="4" fill="#68d8e1"/><text x="644" y="596" fill="#abb1c1" font-size="11">34%</text><rect x="450" y="628" width="240" height="30" rx="10" fill="#8175e9"/><text x="526" y="648" fill="white" font-size="11" font-weight="700">Voice ready  ·  Tap to speak</text><text x="60" y="240" fill="#b1a9ff" font-size="10" letter-spacing="2">DESIGNED FOR TOUCH</text><text x="60" y="278" fill="#f6f7fb" font-size="20" font-weight="700">No app-store friction.</text><text x="60" y="310" fill="#858b9f" font-size="13">Open the LAN URL, add it to</text><text x="60" y="332" fill="#858b9f" font-size="13">your home screen, and control</text><text x="60" y="354" fill="#858b9f" font-size="13">the room with one thumb.</text></g>
</svg>
