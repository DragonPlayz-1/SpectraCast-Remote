<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">SpectraCast pairing flow</title><desc id="desc">A secure pairing dialog with a six-character device code.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08090f"/><stop offset="1" stop-color="#211b42"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#171a29"/><stop offset="1" stop-color="#0f111b"/></linearGradient><radialGradient id="glow"><stop stop-color="#8b7cff" stop-opacity=".35"/><stop offset="1" stop-color="#8b7cff" stop-opacity="0"/></radialGradient></defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/><circle cx="1000" cy="180" r="260" fill="url(#glow)"/><g font-family="Inter,Arial,sans-serif"><text x="52" y="54" fill="#f6f7fb" font-size="20" font-weight="700">◈ Spectra<tspan fill="#858b9f" font-weight="400">Cast</tspan></text><text x="52" y="102" fill="#858b9f" font-size="12">A private remote for every screen in your space.</text><rect x="205" y="120" width="790" height="520" rx="26" fill="#090a11" fill-opacity=".84" stroke="#ffffff" stroke-opacity=".12"/><rect x="246" y="161" width="315" height="438" rx="18" fill="#15142e"/><circle cx="404" cy="362" r="126" fill="none" stroke="#9588ff" stroke-opacity=".22"/><circle cx="404" cy="362" r="94" fill="none" stroke="#68d8e1" stroke-opacity=".15"/><rect x="319" y="291" width="170" height="112" rx="12" fill="#0d0f17" stroke="#9588ff" stroke-opacity=".6"/><path d="M342 421h125M357 403h95" stroke="#858b9f" stroke-width="5" stroke-linecap="round"/><circle cx="404" cy="347" r="24" fill="#6e64da" opacity=".72"/><path d="M404 335v24m-12-12h24" stroke="#f6f7fb" stroke-width="4" stroke-linecap="round"/><text x="297" y="531" fill="#b1a9ff" font-size="11" letter-spacing="2">SECURE LOCAL LINK</text><text x="297" y="558" fill="#858b9f" font-size="12">Your identity never leaves</text><text x="297" y="578" fill="#858b9f" font-size="12">this computer.</text><text x="612" y="206" fill="#b1a9ff" font-size="10" letter-spacing="2">DEVICE SETUP</text><text x="612" y="250" fill="#f6f7fb" font-size="31" font-weight="700">Connect a screen</text><text x="612" y="284" fill="#a0a3b5" font-size="13">Bring your living room online in two calm steps.</text><circle cx="625" cy="340" r="15" fill="#8175e9"/><text x="621" y="345" fill="white" font-size="12">1</text><text x="656" y="344" fill="#f6f7fb" font-size="13">Choose Pair new device on your TV.</text><circle cx="625" cy="386" r="15" fill="#8175e9"/><text x="621" y="391" fill="white" font-size="12">2</text><text x="656" y="390" fill="#f6f7fb" font-size="13">Enter the code shown on screen.</text><text x="612" y="443" fill="#858b9f" font-size="10" letter-spacing="2">PAIRING CODE</text><rect x="612" y="458" width="314" height="58" rx="11" fill="#0b0d15" stroke="#9588ff" stroke-opacity=".55"/><text x="658" y="496" fill="#f6f7fb" font-size="24" letter-spacing="8">A1B2C3</text><rect x="612" y="542" width="150" height="38" rx="9" fill="#8175e9"/><text x="642" y="566" fill="white" font-size="12" font-weight="700">⌁  Pair device</text><text x="785" y="566" fill="#78e4af" font-size="11">● TV found</text></g>
</svg>
